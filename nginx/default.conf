server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~* \.(?:css|js|png|jpg|jpeg|gif|svg|ico|xml|txt|pdf)$ {
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
    }
}
