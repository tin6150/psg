apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: psg-site
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  rules:
    - host: psg.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: psg-site
                port:
                  number: 80
